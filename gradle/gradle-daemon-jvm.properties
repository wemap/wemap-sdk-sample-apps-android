# The JDK the Gradle daemon runs on: JetBrains Runtime 21.0.10, downloaded from JetBrains on first build. Written by
# hand rather than by `updateDaemonJvm`, whose foojay URLs stopped resolving in October 2026
# (https://github.com/foojayio/discoapi/issues/165).
toolchainUrl.LINUX.AARCH64=https\://cache-redirector.jetbrains.com/intellij-jbr/jbrsdk_jcef-21.0.10-linux-aarch64-b1163.108.tar.gz
toolchainUrl.LINUX.X86_64=https\://cache-redirector.jetbrains.com/intellij-jbr/jbrsdk_jcef-21.0.10-linux-x64-b1163.108.tar.gz
toolchainUrl.MAC_OS.AARCH64=https\://cache-redirector.jetbrains.com/intellij-jbr/jbrsdk_jcef-21.0.10-osx-aarch64-b1163.108.tar.gz
toolchainUrl.MAC_OS.X86_64=https\://cache-redirector.jetbrains.com/intellij-jbr/jbrsdk_jcef-21.0.10-osx-x64-b1163.108.tar.gz
toolchainUrl.WINDOWS.AARCH64=https\://cache-redirector.jetbrains.com/intellij-jbr/jbrsdk_jcef-21.0.10-windows-aarch64-b1163.108.zip
toolchainUrl.WINDOWS.X86_64=https\://cache-redirector.jetbrains.com/intellij-jbr/jbrsdk_jcef-21.0.10-windows-x64-b1163.108.zip
