[versions]
wemap = "1.0.0-beta.1"
# The offline VPS module publishes with the base SDKs but under a version of its own: its whole public
# API is `@AlphaVpsLocalApi` and does not follow semantic versioning, so it keeps an `-alpha.N` suffix.
wemapVpsLocal = "1.0.0-alpha.4"

# plugins
androidGradlePlugin = "8.13.2"
# The SDK's consumer floor. `com.getwemap.sdk:core` re-exposes kotlinx-serialization 1.11.0 through `api`,
# and reading that artifact's metadata needs a 2.2 compiler, so anything below this fails to resolve it.
kotlin = "2.2.21"

# sdk levels
compileSdk = "37"
minSdk = "23"
targetSdk = "37"

# dependencies
maplibreAnnotationV9 = "3.0.2"
appcompat = "1.8.0"
coreKtx = "1.18.0"
fragmentKtx = "1.9.0"
material = "1.14.0"
navigationFragmentKtx = "2.9.8"
preferenceKtx = "1.2.1"
composeBom = "2026.06.01"
activityCompose = "1.13.0"

[libraries]
# common
androidx-fragment-ktx = { module = "androidx.fragment:fragment-ktx", version.ref = "fragmentKtx" }
material = { module = "com.google.android.material:material", version.ref = "material" }

# maplibre
maplibre-annotation-v9 = { group = "org.maplibre.gl", name = "android-plugin-annotation-v9", version.ref = "maplibreAnnotationV9" }

# androidx
androidx-appcompat = { module = "androidx.appcompat:appcompat", version.ref = "appcompat" }
androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "coreKtx" }
androidx-navigation-fragment-ktx = { group = "androidx.navigation", name = "navigation-fragment-ktx", version.ref = "navigationFragmentKtx" }
androidx-navigation-ui-ktx = { group = "androidx.navigation", name = "navigation-ui-ktx", version.ref = "navigationFragmentKtx" }
androidx-preference-ktx = { module = "androidx.preference:preference-ktx", version.ref = "preferenceKtx" }

# compose — versions come from the BOM, so these entries carry none of their own
androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
androidx-compose-foundation = { group = "androidx.compose.foundation", name = "foundation" }
androidx-compose-material3 = { group = "androidx.compose.material3", name = "material3" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
androidx-lifecycle-runtime-compose = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose" }

# wemap
wemap-core = { group = "com.getwemap.sdk", name = "core", version.ref = "wemap" }
wemap-map = { group = "com.getwemap.sdk", name = "map", version.ref = "wemap" }
wemap-map-compose = { group = "com.getwemap.sdk", name = "map-compose", version.ref = "wemap" }
wemap-geoar = { group = "com.getwemap.sdk", name = "geo-ar", version.ref = "wemap" }
wemap-geoar-compose = { group = "com.getwemap.sdk", name = "geo-ar-compose", version.ref = "wemap" }

# wemap positioning
wemap-positioning-vps-arcore = { group = "com.getwemap.sdk.positioning", name = "wemap-vps-arcore", version.ref = "wemap" }
wemap-positioning-vps-local = { group = "com.getwemap.sdk.positioning", name = "wemap-vps-local", version.ref = "wemapVpsLocal" }
wemap-positioning-android-fused-adaptive = { group = "com.getwemap.sdk.positioning", name = "android-fused-adaptive", version.ref = "wemap" }
wemap-positioning-fused-gms = { group = "com.getwemap.sdk.positioning", name = "fused-gms", version.ref = "wemap" }
wemap-positioning-gps = { group = "com.getwemap.sdk.positioning", name = "gps", version.ref = "wemap" }

[plugins]
android-application = { id = "com.android.application", version.ref = "androidGradlePlugin" }
android-library = { id = "com.android.library", version.ref = "androidGradlePlugin" }
kotlin-android = { id = 'org.jetbrains.kotlin.android', version.ref = "kotlin" }
kotlin-compose = { id = 'org.jetbrains.kotlin.plugin.compose', version.ref = "kotlin" }
kotlin-serialization = { id = 'org.jetbrains.kotlin.plugin.serialization', version.ref = "kotlin" }
